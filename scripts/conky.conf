conky.config = {
    -- 基础设置
    background = true,
    update_interval = 2.0,
    double_buffer = true,
    no_buffers = true,
    uppercase = false,
    use_xft = true,
    font = 'monospace:size=18',
    xftalpha = 0.8,

    -- 窗口与透明
    own_window = true,
    own_window_type = 'desktop',          -- 贴在桌面层，不干扰其他窗口
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '#00000000',

    -- 位置 (右上角，可改)
    alignment = 'bottom_left',
    gap_x = 30,
    gap_y = 40,

    -- 颜色 (冷灰白调，低调不抢眼)
    default_color = '#c0c0c0',
    color1 = '#8a9ba8',                   -- 冷灰蓝，用于标签
};

conky.text = [[
${color1}${time %H:%M}${color}
${color1}${time %a %d %b}${color}

${color1}UPTIME ${color}$uptime
${color1}CPU    ${color}${cpu cpu0}%  ${cpubar cpu0 4,60}
${color1}MEM    ${color}${memperc}%  ${membar 4,60}

${color1}NET    ${color}↓${downspeedf enp0s3}K  ↑${upspeedf enp0s3}K
${color1}DISK   ${color}${fs_used_perc /}%  ${fs_bar 4,60 /}
]];
